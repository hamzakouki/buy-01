services:

  jenkins-docker:
    image: docker:dind
    container_name: jenkins-docker
    privileged: true
    command: --storage-driver overlay2
    environment:
      DOCKER_TLS_CERTDIR: /certs
    networks:
      jenkins:
        aliases:
          - docker
    volumes:
      - jenkins-docker-certs:/certs/client
    ports:
      - "8888:8888"
      - "8761:8761"
    restart: always

  jenkins-blueocean:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: myjenkins-blueocean:2.568.3-1
    container_name: jenkins-blueocean
    networks:
      - jenkins
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"

      # ---- JCasC : variables interpolées dans jenkins-casc.yaml ----
      GITHUB_USERNAME: ${GITHUB_USERNAME}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GMAIL_USERNAME: ${GMAIL_USERNAME}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      SSL_PASSWORD: ${SSL_PASSWORD}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64}
    ports:
      - "8080:8080"
      - "4200:4200"
    volumes:
      - jenkins-data:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro
      - ./jenkins:/var/jenkins_home/casc_configs:ro
      - ./secrets:/run/secrets:ro
    depends_on:
      - jenkins-docker
    restart: on-failure


  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    networks:
      - jenkins
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    restart: unless-stopped


networks:
  jenkins:
    name: jenkins
    driver: bridge

volumes:
  jenkins-data:
    name: jenkins-data
  jenkins-docker-certs:
    name: jenkins-docker-certs  

  sonarqube-data:
    name: sonarqube-data

  sonarqube-extensions:
    name: sonarqube-extensions

  sonarqube-logs:
    name: sonarqube-logs